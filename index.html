    <script>
      (function () {
        window.addEventListener(
          'error',
          function (event) {
            if (
              event &&
              typeof event.filename === 'string' &&
              event.filename.indexOf('chrome-extension://') === 0
            ) {
              event.stopImmediatePropagation();
              event.preventDefault();
            }
          },
          true
        );
        try {
          var ownDesc = Object.getOwnPropertyDescriptor(window, 'fetch');
          var protoDesc =
            !ownDesc && window.Window && window.Window.prototype
              ? Object.getOwnPropertyDescriptor(window.Window.prototype, 'fetch')
              : null;
          var desc = ownDesc || protoDesc;
          if (desc && desc.get && !desc.set && (!ownDesc || ownDesc.configurable)) {
            var origGet = desc.get;
            var customFetch = null;
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: Boolean(desc.enumerable),
              get: function () {
                return customFetch || origGet.call(window);
              },
              set: function (nextFetch) {
                customFetch = nextFetch;
              },
            });
          }
        } catch (_err) {
          // Ignore if host environment locks fetch property
        }
      })();
    </script>
